[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siracusa-daily"
version = "0.1.0"
description = "Retrieval, selection and newsletter drafting pipeline for SiracusaDaily"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.4,<13", "pypdf>=5.0,<7"]

[project.scripts]
siracusa-daily = "siracusa_daily.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

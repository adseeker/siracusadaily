name: Controllo consegna newsletter

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  delivery-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Rome
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}

    steps:
      - name: Scarica il motore
        uses: actions/checkout@v5

      - name: Prepara Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Installa il client operativo
        run: python -m pip install --disable-pip-version-check -e backend

      - name: Verifica che la campagna sia partita
        run: siracusa-daily delivery-check --grace-minutes 15

      - name: Segnala l'anomalia
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          edition_date="$(date +%F)"
          title="Newsletter delivery anomaly $edition_date"
          if ! gh issue list --state open --search "$title in:title" --json title --jq '.[].title' | grep -Fxq "$title"; then
            gh issue create \
              --title "$title" \
              --body "La campagna odierna manca oppure non risulta partita dopo la tolleranza prevista. Non duplicarla automaticamente. Verifica Brevo e, dopo aver escluso destinatari accodati, applica il runbook Sender. Log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
